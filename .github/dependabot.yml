version: 2
updates:
  # Dev tools of all workspace packages (one lockfile at the root).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually found and pulled within days.
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ['*']
    open-pull-requests-limit: 5

  # The actions in .github/workflows, which stay pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
