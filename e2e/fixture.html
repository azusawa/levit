<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Levit E2E fixture</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/packages/levit/src/ui/theme.css">
  <style>
    body { margin: 0; padding: 40px; background: var(--levit-bg); }
    #editor { max-width: 720px; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script type="module">
    import { createLevitEditor, createBubbleMenu, createSlashMenu } from '/packages/levit/src/index.ts';

    const editor = createLevitEditor(document.getElementById('editor'), {
      placeholder: 'Type here',
      // Stands in for a real upload: the image is shown from a local blob URL.
      uploadImage: async (file) => URL.createObjectURL(file),
      // A tiny highlighter: wraps a few keywords, like highlight.js would.
      highlightCode: (code) =>
        code.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])
          .replace(/\b(let|const|return)\b/g, '<span class="kw">$1</span>'),
    });
    createBubbleMenu(editor);
    createSlashMenu(editor);

    // Tests read the document model through this handle.
    window.editor = editor;
    window.editorReady = true;
  </script>
</body>
</html>
